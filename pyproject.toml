[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rosie-df"
version = "0.1.0"
description = "High-performance DataFrame Rosetta Stone powered by Polars"
readme = "README.md"
dependencies = [
    "pyyaml>=6.0",
    "polars>=1.0.0"
]

[project.scripts]
rosie = "rosie_df.cli:main"

[tool.setuptools.package-data]
rosie_df = ["data/*.yaml"]